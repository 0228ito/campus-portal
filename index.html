<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学生向けリアル情報ポータル (2026 UI & スマート検索対応)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Material Icons Font -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Google Fonts (Noto Sans JP, Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <!-- React & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #0f172a;
    }
    /* フローティングハートアニメーション */
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
    }
    .animate-float-heart {
      animation: floatUp 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    /* 弾むバウンスアニメーション */
    @keyframes springBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.22); }
      65% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }
    .animate-bounce-click {
      animation: springBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    /* アニメーション表示用 */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    /* シマーアニメーション（認証バッジ用） */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-bg {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 初期フィードデータ
    const INITIAL_POSTS = [
      {
        id: 1,
        author: "経済3年（あなた）",
        grade: "3年",
        category: "授業・過去問",
        title: "【マクロ経済学Ⅰ】期末テスト出題傾向＆過去問ノート",
        content: "講義の最終回で教授が強調していた「問3の計算問題」と過去問の類似パターンです！昨年の解法メモも添付しています。参考になったらサンクスお願いします！",
        thanks: 89,
        views: 840,
        commentsCount: 2,
        time: "3日前",
        isLiked: false,
        image: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=600&auto=format&fit=crop&q=60",
        comments: [
          { id: 101, user: "経済1年", text: "このノートのおかげで過去問問3解けました！神です泣", time: "2日前" },
          { id: 102, user: "総合理系1年", text: "マクロ経済落としそうだったので本当に助かります！", time: "1日前" }
        ]
      },
      {
        id: 2,
        author: "総合理系2年",
        grade: "2年",
        category: "休講・掲示板",
        title: "【写真あり】理学部2号館前の休講・補講通知掲示板",
        content: "2号館ロビーに張り出されていた今週の補講・休講一覧です。公式ポータル更新遅いので必要な方どうぞ！",
        thanks: 42,
        views: 580,
        commentsCount: 1,
        time: "1週間前",
        isLiked: false,
        image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&auto=format&fit=crop&q=60",
        comments: [
          { id: 201, user: "物理2年", text: "助かりました！わざわざ見に見に行かずに済みました", time: "5日前" }
        ]
      },
      {
        id: 3,
        author: "文学部4年",
        grade: "4年",
        category: "グルメ・学食",
        title: "北部食堂の期間限定ビビンバ丼レポ＆100円オフ技",
        content: "今週限定のビビンバ丼、めちゃくちゃ美味いです！生協アプリの事前エントリーで100円引きになるので忘れずに。",
        thanks: 28,
        views: 310,
        commentsCount: 0,
        time: "5時間前",
        isLiked: false,
        image: "https://images.unsplash.com/photo-1553163147-622ab57be1c7?w=600&auto=format&fit=crop&q=60",
        comments: []
      }
    ];

    // AI要約ダイレクト回答データ（キーワードやタグごとに即回答を表示）
    const DIRECT_ANSWERS = {
      "過去問": {
        title: "⚡ 【AI要約】『過去問・テスト対策』の要点",
        summary: "『マクロ経済学Ⅰ』は最終回講義で強調された【問3の計算問題】が期末テストの8割を占めます。対策ノート（経済3年投稿）が840回閲覧されており信頼度最高です。",
        tag: "授業・過去問"
      },
      "休講": {
        title: "⚡ 【AI要約】『今日の休講・補講』速報",
        summary: "理学部2号館ロビー掲示板の最新情報：今週の補講・休講一覧が投稿済みです。教養棟2階掲示板の変更情報もリアルタイム反映中。",
        tag: "休講・掲示板"
      },
      "グルメ": {
        title: "⚡ 【AI要約】『学食・キャンパスグルメ』のお得情報",
        summary: "北部食堂の期間限定ビビンバ丼が人気！生協アプリで事前エントリーすると100円引きクーポンの適用が可能です。",
        tag: "グルメ・学食"
      },
      "楽単": {
        title: "⚡ 【AI要約】『単位取得・履修』の攻略ヒント",
        summary: "経済学部教養科目・マクロ経済学Ⅰは過去問解法メモの参照で単位取得率が大幅UP。出席確認はランダムです。",
        tag: "授業・過去問"
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState(0);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [userThanks, setUserThanks] = useState(132);
      const [userGrade] = useState(3);
      
      // 検索＆フィルターステート
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedTag, setSelectedTag] = useState("");

      // モーダル状態管理
      const [selectedPost, setSelectedPost] = useState(null);
      const [openNewPostModal, setOpenNewPostModal] = useState(false);
      const [openReportModal, setOpenReportModal] = useState(false);
      
      // 新規投稿フォーム入力状態
      const [newTitle, setNewTitle] = useState("");
      const [newContent, setNewContent] = useState("");
      const [newCategory, setNewCategory] = useState("授業・過去問");
      const [commentInput, setCommentInput] = useState("");

      // パーティクルアニメーション＆トースト管理
      const [floatingHearts, setFloatingHearts] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handleThanks = (e, postId) => {
        e.stopPropagation();
        
        // 押下位置からハートを飛ばす
        const rect = e.currentTarget.getBoundingClientRect();
        const heartId = Date.now();
        setFloatingHearts(prev => [
          ...prev, 
          { id: heartId, x: rect.left + rect.width / 2, y: rect.top - 10 }
        ]);
        setTimeout(() => {
          setFloatingHearts(prev => prev.filter(h => h.id !== heartId));
        }, 900);

        // トータルサンクス増算＆ポスト更新
        setPosts(prevPosts =>
          prevPosts.map(p => {
            if (p.id === postId) {
              const newIsLiked = !p.isLiked;
              const thanksDiff = newIsLiked ? 1 : -1;
              if (newIsLiked) {
                setUserThanks(t => t + 1);
                showToast(`💖 先輩へ感謝が伝わりました！（あなたの恩送り実績：通算${userThanks + 1}pt）`);
              }
              return {
                ...p,
                isLiked: newIsLiked,
                thanks: p.thanks + thanksDiff
              };
            }
            return p;
          })
        );
      };

      const handleAddComment = (postId) => {
        if (!commentInput.trim()) return;
        const newCommentObj = {
          id: Date.now(),
          user: "経済3年（あなた）",
          text: commentInput.trim(),
          time: "たった今"
        };

        setPosts(prevPosts =>
          prevPosts.map(p => {
            if (p.id === postId) {
              return {
                ...p,
                commentsCount: p.commentsCount + 1,
                comments: [...p.comments, newCommentObj]
              };
            }
            return p;
          })
        );

        if (selectedPost && selectedPost.id === postId) {
          setSelectedPost(prev => ({
            ...prev,
            commentsCount: prev.commentsCount + 1,
            comments: [...prev.comments, newCommentObj]
          }));
        }

        setCommentInput("");
        showToast("💬 コメントを送信しました！");
      };

      const handleCreatePost = (e) => {
        if (e) e.preventDefault();
        const postTitle = newTitle.trim() || "【新着】キャンパス共有情報";
        const postContent = newContent.trim() || "写真を投稿しました！確認してください。";

        const newPostObj = {
          id: Date.now(),
          author: "経済3年（あなた）",
          grade: `${userGrade}年`,
          category: newCategory,
          title: postTitle,
          content: postContent,
          thanks: 0,
          views: 1,
          commentsCount: 0,
          time: "たった今",
          isLiked: false,
          image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&auto=format&fit=crop&q=60",
          comments: []
        };

        setPosts([newPostObj, ...posts]);
        setNewTitle("");
        setNewContent("");
        setOpenNewPostModal(false);
        setCurrentTab(0);
        setUserThanks(t => t + 10);
        showToast("🎉 情報共有ありがとうございました！（+10サンクス獲得）");
      };

      const filteredPosts = useMemo(() => {
        return posts.filter(post => {
          const matchesQuery = searchQuery === "" || 
            post.title.includes(searchQuery) || 
            post.content.includes(searchQuery) || 
            post.category.includes(searchQuery);
          
          const matchesTag = selectedTag === "" || post.category === selectedTag;

          return matchesQuery && matchesTag;
        });
      }, [posts, searchQuery, selectedTag]);

      // ダイレクト回答（検索キーワードや選択タグにマッチするAI要約）を判定
      const activeDirectAnswer = useMemo(() => {
        if (selectedTag) {
          const match = Object.values(DIRECT_ANSWERS).find(a => a.tag === selectedTag);
          if (match) return match;
        }
        if (searchQuery) {
          const key = Object.keys(DIRECT_ANSWERS).find(k => searchQuery.includes(k));
          if (key) return DIRECT_ANSWERS[key];
        }
        return null;
      }, [searchQuery, selectedTag]);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 flex flex-col relative pb-20 border-x border-slate-800 shadow-2xl">
          
          {/* ヘッダー */}
          <header className="bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80 p-3.5">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-emerald-500/20">
                  <span className="material-icons text-lg">school</span>
                </div>
                <div>
                  <h1 className="font-black text-sm tracking-wide text-white leading-tight">キャンパスリアルポータル</h1>
                  <span className="text-[10px] text-slate-400 block font-medium">北大公式コミュニティ</span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="bg-emerald-500/15 text-emerald-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1 relative overflow-hidden">
                  <div className="shimmer-bg absolute inset-0 pointer-events-none" />
                  <span className="material-icons text-[12px]">verified</span>
                  <span>北大認証済</span>
                </div>
                <div className="bg-amber-400/10 text-amber-300 px-2.5 py-1 rounded-full text-xs font-bold border border-amber-400/20 flex items-center gap-1">
                  <span className="material-icons text-amber-400 text-sm">stars</span>
                  <span>{userThanks} pt</span>
                </div>
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="flex-1 p-3 space-y-3">
            
            {/* TABS 0: リアルタイムフィード ＆ スマート検索 */}
            {currentTab === 0 && (
              <div className="space-y-3">
                
                {/* 🔍【スマート検索エリア】一覧から探す手間を省く検索UI */}
                <div className="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/60 shadow-lg space-y-2.5 backdrop-blur-sm">
                  <div className="relative">
                    <span className="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">search</span>
                    <input 
                      type="text" 
                      placeholder="欲しい情報をダイレクト検索（例: マクロ経済, 過去問, 休講...）" 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full bg-slate-900/90 border border-slate-700 text-white rounded-xl pl-9 pr-8 py-2 text-xs focus:ring-2 focus:ring-emerald-500 outline-none placeholder:text-slate-500"
                    />
                    {searchQuery && (
                      <button 
                        onClick={() => setSearchQuery("")}
                        className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"
                      >
                        <span className="material-icons text-sm">close</span>
                      </button>
                    )}
                  </div>

                  {/* 口語・シチュエーションタグ */}
                  <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px] scrollbar-none">
                    <button 
                      onClick={() => setSelectedTag(selectedTag === "授業・過去問" ? "" : "授業・過去問")}
                      className={`px-2.5 py-1 rounded-lg font-extrabold transition-all whitespace-nowrap flex items-center gap-1 ${
                        selectedTag === "授業・過去問" 
                          ? 'bg-emerald-500 text-slate-950 font-black shadow-md shadow-emerald-500/20' 
                          : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'
                      }`}
                    >
                      <span>#過去問・テスト対策</span>
                    </button>
                    <button 
                      onClick={() => {
                        setSearchQuery(searchQuery === "楽単" ? "" : "楽単");
                      }}
                      className={`px-2.5 py-1 rounded-lg font-extrabold transition-all whitespace-nowrap flex items-center gap-1 ${
                        searchQuery === "楽単" 
                          ? 'bg-amber-400 text-slate-950 font-black' 
                          : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'
                      }`}
                    >
                      <span>#楽単・おすすめ</span>
                    </button>
                    <button 
                      onClick={() => setSelectedTag(selectedTag === "休講・掲示板" ? "" : "休講・掲示板")}
                      className={`px-2.5 py-1 rounded-lg font-extrabold transition-all whitespace-nowrap flex items-center gap-1 ${
                        selectedTag === "休講・掲示板" 
                          ? 'bg-emerald-500 text-slate-950 font-black' 
                          : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'
                      }`}
                    >
                      <span>#今日の休講</span>
                    </button>
                    <button 
                      onClick={() => setSelectedTag(selectedTag === "グルメ・学食" ? "" : "グルメ・学食")}
                      className={`px-2.5 py-1 rounded-lg font-extrabold transition-all whitespace-nowrap flex items-center gap-1 ${
                        selectedTag === "グルメ・学食" 
                          ? 'bg-emerald-500 text-slate-950 font-black' 
                          : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'
                      }`}
                    >
                      <span>#学食・クーポン</span>
                    </button>
                  </div>
                </div>

                {/* ⚡【ダイレクト・アンサーカード】検索結果一覧から探さなくても答えがわかる */}
                {activeDirectAnswer && (
                  <div className="bg-gradient-to-r from-emerald-900/60 via-teal-900/50 to-slate-800 p-3.5 rounded-2xl border border-emerald-500/40 shadow-xl space-y-1.5 animate-fade-in relative overflow-hidden">
                    <div className="flex justify-between items-center">
                      <span className="font-extrabold text-xs text-emerald-300 flex items-center gap-1">
                        <span className="material-icons text-amber-400 text-sm">bolt</span>
                        {activeDirectAnswer.title}
                      </span>
                      <span className="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold border border-emerald-500/30">
                        AI即回答
                      </span>
                    </div>
                    <p className="text-xs text-slate-200 leading-relaxed font-medium">
                      {activeDirectAnswer.summary}
                    </p>
                    <span className="text-[10px] text-slate-400 block pt-1 border-t border-white/5">
                      💡 下記に学生の投稿詳細と過去問ノート原文をピックアップ表示しています
                    </span>
                  </div>
                )}

                {/* 学部・大学全体の合計サンクス（助け合い）カウンター */}
                <div className="bg-gradient-to-r from-teal-800 via-emerald-800 to-slate-900 text-white p-3.5 rounded-2xl shadow-md border border-emerald-600/40 relative overflow-hidden">
                  <div className="flex justify-between items-center mb-2">
                    <div className="flex items-center gap-1.5">
                      <span className="material-icons text-emerald-400 text-sm">groups</span>
                      <span className="font-extrabold text-xs tracking-wide">今期のキャンパス助け合い状況</span>
                    </div>
                    <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-400/30 flex items-center gap-1">
                      <span className="material-icons text-[11px]">verified</span>
                      <span>北大認証コミュニティ</span>
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-center bg-black/25 p-2 rounded-xl backdrop-blur-sm border border-white/5">
                    <div className="border-r border-white/10 pr-1">
                      <span className="text-emerald-200 text-[10px] block font-medium">北大全体の累計感謝</span>
                      <span className="font-black text-amber-300 text-sm flex items-center justify-center gap-1">
                        <span className="material-icons text-xs text-pink-400">favorite</span>
                        18,420 <span className="text-[10px] font-normal text-slate-300">回</span>
                      </span>
                    </div>
                    <div className="pl-1">
                      <span className="text-emerald-200 text-[10px] block font-medium">経済学部の貢献状況</span>
                      <span className="font-black text-emerald-300 text-sm flex items-center justify-center gap-1">
                        <span className="material-icons text-xs text-emerald-400">emoji_events</span>
                        3,850 <span className="text-[10px] font-normal text-slate-300">pt (全学部2位)</span>
                      </span>
                    </div>
                  </div>
                </div>

                {/* 告知ヘッダー */}
                <div className="bg-gradient-to-r from-amber-500 to-orange-600 text-slate-950 p-3 rounded-2xl shadow-sm text-xs flex justify-between items-center">
                  <div>
                    <span className="font-black block text-sm">💡 後輩への恩送りキャンペーン中</span>
                    <span className="text-slate-900 font-bold text-[11px]">講義・過去問写真の投稿で +10サンクスGET！</span>
                  </div>
                  <button 
                    onClick={() => setOpenNewPostModal(true)}
                    className="bg-slate-950 text-amber-400 px-3 py-1.5 rounded-xl font-black shadow hover:bg-slate-900 text-xs"
                  >
                    投稿する
                  </button>
                </div>

                {/* 検索・絞り込み件数表示 */}
                {(searchQuery || selectedTag) && (
                  <div className="flex justify-between items-center text-xs text-slate-400 px-1 pt-1">
                    <span>該当情報：<strong className="text-emerald-400 font-bold">{filteredPosts.length}</strong> 件</span>
                    <button 
                      onClick={() => { setSearchQuery(""); setSelectedTag(""); }}
                      className="text-emerald-400 underline text-[11px]"
                    >
                      条件クリア
                    </button>
                  </div>
                )}

                {/* ポスト一覧 */}
                {filteredPosts.length === 0 ? (
                  <div className="bg-slate-800/40 p-8 rounded-2xl text-center border border-slate-800 text-slate-400 text-xs">
                    <span className="material-icons text-3xl mb-1 text-slate-500">search_off</span>
                    <p>該当する投稿が見つかりませんでした。</p>
                  </div>
                ) : (
                  filteredPosts.map(post => (
                    <div 
                      key={post.id}
                      onClick={() => setSelectedPost(post)}
                      className="bg-slate-800/90 rounded-2xl p-4 shadow-lg border border-slate-700/80 hover:border-emerald-500/50 transition-all cursor-pointer relative group"

                <div className="bg-slate-950/80 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                  <div className="flex justify-between"><span className="text-slate-400">氏名:</span><span className="font-bold text-white">北大 太郎</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">所属:</span><span className="font-bold text-white">経済学部 3年</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">無償情報提供回数:</span><span className="font-bold text-emerald-400">14 回</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">総閲覧影響数:</span><span className="font-bold text-emerald-400">1,420 PV</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">獲得感謝（サンクス）:</span><span className="font-bold text-pink-400">{userThanks} pt</span></div>
                  <div className="pt-2 border-t border-slate-800 text-[11px] text-slate-400 leading-snug">
                    ※ 本レポートは、学内ポータルでの無償貢献活動実績を認証・証明するデータです。就職活動の自己PR資料として添付可能です。
                  </div>
                </div>

                <button 
                  onClick={() => {
                    showToast("📄 証明書PDFを出力しました（デモ）");
                    setOpenReportModal(false);
                  }}
                  className="w-full bg-amber-400 text-slate-950 font-black py-2.5 rounded-xl shadow text-xs hover:bg-amber-300"
                >
                  PDFとして保存・出力
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
