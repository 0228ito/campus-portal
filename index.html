<!DOCTYPE html>

  <!-- Google Fonts (Noto Sans JP, Inter) -->

  <!-- React & Babel Standalone -->

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans JP', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #020617;
      color: #0f172a;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    /* 横スクロールバーの非表示 */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* フローティングハートアニメーション */
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: translateY(-60px) scale(1.4); opacity: 0; }
    }
    .animate-float-heart {
      animation: floatUp 0.85s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    /* 弾むバウンスアニメーション */
    @keyframes springBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.18); }
      65% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .animate-bounce-click {
      animation: springBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    /* モーダル表示アニメーション */
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.25s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    /* ホログラムオーラグラデーション（SNSカード用） */
    .hologram-card {
      background: linear-gradient(135deg, #0f172a 0%, #022c22 40%, #1e1b4b 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.15);
    }
    /* シマーアニメーション */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .shimmer-bg {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
      animation: shimmer 2.5s infinite;
    }
  </style>
</head>

    // 初期マイ活動ログデータ（公開範囲機能付き）
    const INITIAL_MY_LOGS = [

        category: "学習・テスト対策",

    // AI要約ダイレクト回答データ
    const DIRECT_ANSWERS = {
      "過去問": {
        title: "⚡ 『過去問・テスト対策』の要点",
        summary: "『マクロ経済学Ⅰ』は最終回講義で強調された【問3の計算問題】が期末テストの8割を占めます。対策ノート（経済3年投稿）が信頼度最高です。",
        tag: "授業・過去問"
      },
      "休講": {
        title: "⚡ 『今日の休講・補講』速報",
        summary: "理学部2号館ロビー掲示板の最新情報：今週の補講・休講一覧が投稿済みです。教養棟2階掲示板の変更情報もリアルタイム反映中。",

      },

        title: "⚡ 『学食・グルメ』のお得情報",
        summary: "北部食堂の期間限定ビビンバ丼が人気！生協アプリで事前エントリーすると100円引きクーポンの適用が可能です。",

      },
      "楽単": {
        title: "⚡ 『単位取得・履修』の攻略ヒント",
        summary: "経済学部教養科目・マクロ経済学Ⅰは過去問解法メモの参照で単位取得率が大幅UP。出席確認はランダムです。",
        tag: "授業・過去問"
      }
    };

    function App() {
      const [currentTab, setCurrentTab] = useState(0);
      const [posts, setPosts] = useState(INITIAL_POSTS);
      const [userThanks, setUserThanks] = useState(143);
      const [userGrade] = useState(3);
      
      // マイページ用ステート
      const [myLogs, setMyLogs] = useState(INITIAL_MY_LOGS);
      const [myPageSubTab, setMyPageSubTab] = useState("posts"); // "posts" | "logs"
      const [openLogModal, setOpenLogModal] = useState(false);
      const [logTitle, setLogTitle] = useState("");
      const [logCategory, setLogCategory] = useState("学習・テスト対策");
      const [logNote, setLogNote] = useState("");
      const [logPrivacy, setLogPrivacy] = useState("PUBLIC");
      const [logImage, setLogImage] = useState(null);

      // AI自己分析ステート
      const [openAiAnalysisModal, setOpenAiAnalysisModal] = useState(false);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiAnalysisResult, setAiAnalysisResult] = useState(null);

      // 検索＆フィルターステート
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedTag, setSelectedTag] = useState("");

      // モーダル状態管理
      const [selectedPost, setSelectedPost] = useState(null);
      const [openNewPostModal, setOpenNewPostModal] = useState(false);
      const [openReportModal, setOpenReportModal] = useState(false);
      
      // フォーム入力状態
      const [newTitle, setNewTitle] = useState("");
      const [newContent, setNewContent] = useState("");
      const [newCategory, setNewCategory] = useState("授業・過去問");
      const [newImage, setNewImage] = useState(null);
      const [commentInput, setCommentInput] = useState("");

      // アニメーション＆トースト
      const [floatingHearts, setFloatingHearts] = useState([]);
      const [toastMessage, setToastMessage] = useState(null);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // ログ画像選択ハンドラー
      const handleLogImageSelect = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setLogImage(reader.result);
            showToast("📷 ログに写真をセットしました");
          };
          reader.readAsDataURL(file);
        } else {
          setLogImage("https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600&auto=format&fit=crop&q=60");
          showToast("📷 サンプル写真をセットしました");
        }
      };

      // 活動ログ新規作成ハンドラー
      const handleCreateLog = (e) => {
        if (e) e.preventDefault();
        if (!logTitle.trim()) return;

        const newLogObj = {
          id: Date.now(),
          title: logTitle.trim(),
          category: logCategory,
          date: new Date().toISOString().split('T')[0],
          privacy: logPrivacy,
          note: logNote.trim(),
          image: logImage
        };

        setMyLogs([newLogObj, ...myLogs]);
        setLogTitle("");
        setLogNote("");
        setLogImage(null);
        setOpenLogModal(false);
        showToast("📖 活動ログを記録しました！");
      };

      // AI自己分析の生成 (Gemini API 呼び出し)
      const handleRunAiAnalysis = async () => {
        setIsAnalyzing(true);
        setOpenAiAnalysisModal(true);

        const logsText = myLogs.map(l => `[${l.date}] ${l.category} - ${l.title}: ${l.note}`).join("\n");
        const prompt = `あなたは大学生の行動ログから自己分析を行うAIキャリアカウンセラーです。
以下の学生の【キャンパス活動ログ】を元に、客観的な自己分析を行ってください。

【活動ログ一覧】
${logsText}

以下の3つの項目で丁寧かつポジティブに要約・解説してください。
1. 「過去のあなたの思考・行動傾向」（1年前・過去のログから見えてくる人物像）
2. 「ログから発見できるあなたの強み」（客観的な長所・得意なこと）
3. 「これからの行動へのワンポイントヒント」（今後伸ばせそうな領域）`;

        try {
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
          
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }]
            })
          });

          const result = await response.json();
          const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;

          if (text) {
            setAiAnalysisResult(text);
          } else {
            throw new Error("No response text");
          }
        } catch (error) {
          // エラー時・フォールバック表示
          setAiAnalysisResult(`### 🧠 あなたのキャンパス行動・傾向分析

#### 1. 過去のあなたの思考・行動傾向
過去のログを振り返ると、あなたは**「目標達成に向けて直前に集中的に過去問やリソースを集めて攻略する」**という高い集中力と効率重視の傾向が見られます。1年前のあなたは課題を個人の努力で乗り越えようとする職人タイプでした。

#### 2. 発見されたあなたの隠れた強み
* **徹底的な情報収集力**：過去問や空き教室などの有用情報を自ら足で探す行動力があります。
* **知見の構造化と共有力**：得た気づきをメモに落とし込み、周囲に還元できる「ギバー（与える人）」の資質を持っています。

#### 3. これからの行動へのアドバイス
個人での情報蓄積だけでなく、学内のグループやプロジェクトで「情報提供役・ナビゲーター」として動くことで、周囲から頼られるリーダーシップが自然と身についていきます！`);
        } finally {
          setIsAnalyzing(false);
        }
      };

      // ログの公開範囲変更ハンドラー
      const toggleLogPrivacy = (logId) => {
        setMyLogs(prev => prev.map(log => {
          if (log.id === logId) {
            const nextPrivacy = log.privacy === "PUBLIC" ? "FOLLOWERS" : log.privacy === "FOLLOWERS" ? "PRIVATE" : "PUBLIC";
            const label = nextPrivacy === "PUBLIC" ? "🌐 全員に公開" : nextPrivacy === "FOLLOWERS" ? "🔒 フォロワー限定" : "👁️ 自分のみ(非公開)";
            showToast(`公開範囲を変更しました：${label}`);
            return { ...log, privacy: nextPrivacy };
          }
          return log;
        }));
      };

      // 画像選択ハンドラー（実ファイルの読み込みまたはサンプル画像）
      const handleImageSelect = (e) => {

        if (file) {

          showToast("📷 サンプル写真を読み込みました");
        }
      };

      const handleThanks = (e, postId) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        const heartId = Date.now();
        setFloatingHearts(prev => [
          ...prev, 
          { id: heartId, x: rect.left + rect.width / 2, y: rect.top - 10 }
        ]);
        setTimeout(() => {
          setFloatingHearts(prev => prev.filter(h => h.id !== heartId));
        }, 900);

        setPosts(prevPosts =>
          prevPosts.map(p => {
            if (p.id === postId) {
              const newIsLiked = !p.isLiked;
              const thanksDiff = newIsLiked ? 1 : -1;
              if (newIsLiked) {
                setUserThanks(t => t + 1);
                showToast(`💖 感謝が伝わりました！（通算${userThanks + 1}pt）`);
              }
              return {
                ...p,
                isLiked: newIsLiked,
                thanks: p.thanks + thanksDiff
              };
            }
            return p;
          })
        );
      };

      const handleAddComment = (postId) => {
        if (!commentInput.trim()) return;
        const newCommentObj = {
          id: Date.now(),
          user: "経済3年（あなた）",
          text: commentInput.trim(),
          time: "たった今"
        };

        setPosts(prevPosts =>
          prevPosts.map(p => {
            if (p.id === postId) {
              return {
                ...p,
                commentsCount: p.commentsCount + 1,
                comments: [...p.comments, newCommentObj]
              };
            }
            return p;
          })
        );

        if (selectedPost && selectedPost.id === postId) {
          setSelectedPost(prev => ({
            ...prev,
            commentsCount: prev.commentsCount + 1,
            comments: [...prev.comments, newCommentObj]
          }));
        }

        setCommentInput("");

        if (e) e.preventDefault();
        const postTitle = newTitle.trim() || (newImage ? "【写真添付】キャンパス情報" : "【新着】キャンパス共有情報");

          id: Date.now(),
          author: "経済3年（あなた）",
          grade: `${userGrade}年`,
          category: newCategory,
          title: postTitle,
          content: postContent,
          thanks: 0,
          views: 1,
          commentsCount: 0,
          time: "たった今",
          isLiked: false,
          image: newImage,
          comments: []
        };

        setPosts([newPostObj, ...posts]);
        setNewTitle("");
        setNewContent("");
        setNewImage(null);
        setOpenNewPostModal(false);
        setCurrentTab(0);
        setUserThanks(t => t + 10);
        showToast("🎉 情報共有ありがとうございました！（+10サンクス獲得）");
      };

      const filteredPosts = useMemo(() => {
        return posts.filter(post => {
          const matchesQuery = searchQuery === "" || 
            post.title.includes(searchQuery) || 
            post.content.includes(searchQuery) || 
            post.category.includes(searchQuery);
          
          const matchesTag = selectedTag === "" || post.category === selectedTag;

          return matchesQuery && matchesTag;
        });
      }, [posts, searchQuery, selectedTag]);

      const activeDirectAnswer = useMemo(() => {
        if (selectedTag) {
          const match = Object.values(DIRECT_ANSWERS).find(a => a.tag === selectedTag);
          if (match) return match;
        }
        if (searchQuery) {
          const key = Object.keys(DIRECT_ANSWERS).find(k => searchQuery.includes(k));
          if (key) return DIRECT_ANSWERS[key];
        }
        return null;
      }, [searchQuery, selectedTag]);

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-slate-950 text-slate-100 flex flex-col relative pb-20 border-x border-slate-800/60 shadow-2xl overflow-x-hidden">
          
          {/* レスポンシブ対応ヘッダー */}
          <header className="bg-slate-900/95 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800/80 px-3 py-2.5 w-full">
            <div className="flex justify-between items-center w-full gap-1">
              {/* アプリロゴ・タイトル */}
              <div className="flex items-center gap-1.5 min-w-0">
                <div className="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-slate-950 font-black shadow-lg flex-shrink-0">
                  <span className="material-icons text-base sm:text-lg">school</span>
                </div>
                <div className="min-w-0 flex-1">
                  <h1 className="font-black text-xs sm:text-sm tracking-tight text-white leading-tight truncate">キャンパスリアルポータル</h1>
                  <span className="text-[9px] text-slate-400 block font-medium truncate">北大公式コミュニティ</span>
                </div>
              </div>

              {/* 右側：認証＆ポイント */}
              <div className="flex items-center gap-1 flex-shrink-0">
                <div className="bg-emerald-500/15 text-emerald-300 text-[9px] font-extrabold px-2 py-1 rounded-full border border-emerald-500/30 flex items-center gap-0.5 relative overflow-hidden">
                  <span className="material-icons text-[10px]">verified</span>
                  <span className="hidden xs:inline">北大</span>認証済
                </div>
                <div className="bg-amber-400/10 text-amber-300 px-2 py-1 rounded-full text-[10px] sm:text-xs font-black border border-amber-400/20 flex items-center gap-0.5">
                  <span className="material-icons text-amber-400 text-xs sm:text-sm">stars</span>
                  <span>{userThanks} pt</span>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 p-2.5 sm:p-3 space-y-3 w-full max-w-full overflow-x-hidden">
            
            {/* TAB 0: フィード */}
            {currentTab === 0 && (
